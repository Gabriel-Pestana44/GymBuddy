{% extends 'base.html' %}

{% block title %}Editar Evento - GymBuddy{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="mb-6 flex justify-between items-center border-b border-gray-100 pb-4">
        <h2 class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight">Editar Detalhes</h2>
        <a href="/evento/{{ evento['id'] }}" class="text-sm font-bold text-indigo-600 hover:text-indigo-800 transition">← Voltar</a>
    </div>

    <form method="POST" class="space-y-5">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Nome do Evento</label>
            <input type="text" name="nome" value="{{ evento['nome'] }}" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Descrição</label>
            <textarea name="descricao" rows="4" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">{{ evento['descricao'] }}</textarea>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="col-span-2">
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Cidade</label>
                <input type="text" name="cidade" value="{{ evento['cidade'] }}" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Estado</label>
                <input type="text" name="estado" value="{{ evento['estado'] }}" maxlength="2" required class="w-full px-2 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-center transition-all text-base uppercase">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Data</label>
                <input type="date" name="data" value="{{ evento['data'] }}" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Horário</label>
                <input type="time" name="horario" value="{{ evento['horario'] }}" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Local (Endereço)</label>
            <input type="text" name="local" value="{{ evento['local'] }}" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Status</label>
            <select name="status" class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base appearance-none cursor-pointer">
                <option value="ABERTO" {% if evento['status'] == 'ABERTO' %}selected{% endif %}>ABERTO</option>
                <option value="FECHADO" {% if evento['status'] == 'FECHADO' %}selected{% endif %}>FECHADO</option>
            </select>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-indigo-100 text-base">
            Salvar Alterações
        </button>
    </form>
</div>
{% endblock %}
