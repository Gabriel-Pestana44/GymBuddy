{% extends 'base.html' %}

{% block title %}Cadastro - GymBuddy{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100/80">
    <h2 class="text-2xl sm:text-3xl font-black text-gray-900 mb-6 text-center tracking-tight">Criar Conta</h2>
    
    <form method="POST" class="space-y-5">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Nome Completo</label>
            <input type="text" name="nome" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-base">
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="col-span-2">
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Cidade</label>
                <input type="text" name="cidade" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-base">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Estado</label>
                <input type="text" name="estado" placeholder="SP" maxlength="2" required class="w-full px-2 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-center transition-all text-base uppercase">
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Email</label>
            <input type="email" name="email" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-base">
        </div>
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Senha</label>
            <input type="password" name="senha" required class="w-full px-4 py-3 border border-gray-300 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-base">
        </div>
        
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-indigo-100 mt-2 text-base">
            Cadastrar
        </button>
    </form>
</div>
{% endblock %}
