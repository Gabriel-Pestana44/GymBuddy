{% extends 'base.html' %}

{% block title %}Criar Evento - GymBuddy{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="mb-6 flex justify-between items-center border-b border-gray-100 pb-4">
        <h2 class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight">Criar Novo Evento</h2>
        <a href="/home" class="text-sm font-bold text-gray-400 hover:text-gray-600 transition">Cancelar</a>
    </div>

    <form method="POST" class="space-y-5">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Nome do Evento</label>
            <input type="text" name="nome" required placeholder="Ex: Corrida Matinal, Pelada de Quinta" class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="col-span-2">
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Cidade</label>
                <input type="text" name="cidade" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Estado (UF)</label>
                <input type="text" name="estado" maxlength="2" placeholder="SP" required class="w-full px-2 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-center transition-all text-base uppercase">
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Descrição do Treino / Atividade</label>
            <textarea name="descricao" rows="4" placeholder="Regras do local, o que levar, nível de experiência necessário..." required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Data</label>
                <input type="date" name="data" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Horário</label>
                <input type="time" name="horario" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Local (Endereço)</label>
            <input type="text" name="local" placeholder="Ex: Parque do Ibirapuera, Arena Hub Quadra 3" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Status / Privacidade</label>
            <select name="status" class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base cursor-pointer appearance-none">
                <option value="ABERTO">Aberto (Qualquer pessoa pode entrar imediatamente)</option>
                <option value="FECHADO">Fechado (Requer aprovação do organizador)</option>
            </select>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-4 rounded-xl transition-all shadow-md shadow-emerald-100 mt-4 text-base">
            Criar Evento Esportivo
        </button>
    </form>
</div>
{% endblock %}
