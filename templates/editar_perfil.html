{% extends 'base.html' %}

{% block title %}Editar Perfil - GymBuddy{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
    <h2 class="text-2xl font-black text-gray-900 mb-6 border-b border-gray-100 pb-3 tracking-tight">Editar Meu Perfil</h2>
    
    <form method="POST" class="space-y-5">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Nome</label>
            <input type="text" name="nome" value="{{ usuario['nome'] }}" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Email</label>
            <input type="email" name="email" value="{{ usuario['email'] }}" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="col-span-2">
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Cidade</label>
                <input type="text" name="cidade" value="{{ usuario['cidade'] }}" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Estado</label>
                <input type="text" name="estado" value="{{ usuario['estado'] }}" required class="w-full px-2 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-center transition-all text-base uppercase">
            </div>
        </div>

        <div class="pt-4 border-t border-gray-100 mt-6 space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Senha Atual <span class="text-rose-500">*</span></label>
                <input type="password" name="senha_atual" required class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Nova Senha (Opcional)</label>
                <input type="password" name="nova_senha" class="w-full px-4 py-3 border border-gray-200 bg-gray-50/50 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-base">
                <small class="text-xs text-gray-400 block mt-1.5 font-medium">Deixe vazio se não quiser alterar a senha.</small>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 pt-4">
            <button type="submit" class="w-full sm:flex-grow bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-indigo-100 text-base order-1 sm:order-2">
                Salvar Alterações
            </button>
            <a href="/home" class="w-full sm:w-auto bg-gray-100 hover:bg-gray-200 active:scale-[0.99] text-gray-600 font-bold px-6 py-3.5 rounded-xl text-base transition-all text-center flex items-center justify-center order-2 sm:order-1">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
